provider: Intel
providerId: intel
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Confidential Computing
  - Attestation
  - oneAPI
  - Heterogeneous Computing
  - Trust
description: Intel exposes developer APIs in two distinct shapes. Intel Trust Authority is a free, independent
  attestation platform with optional paid support; per-call attestation is not metered. Intel oneAPI
  is an open programming model and developer-tools surface (compilers, libraries, performance tools)
  rather than a metered API service - downloads and developer access are free, with optional Intel
  Priority Support subscriptions for enterprise customers. There is no public per-call price list for
  either.
notes: Trust Authority paid-support tier and oneAPI Priority Support are sold contract-by-contract;
  specific dollar amounts are not published. Reconcile against an Intel sales quote.
sources:
  - https://docs.trustauthority.intel.com/main/articles/restapi-intro.html
  - https://www.intel.com/content/www/us/en/developer/tools/oneapi/overview.html
plans:
  - id: intel-trust-authority-free
    name: Intel Trust Authority — Free
    type: freemium
    description: Free attestation service for Intel SGX, Intel TDX, TPM/vTPM, and NVIDIA GPU workloads.
      Available in US/World and EU regions; unavailable to customers in mainland China.
    entries:
      - label: Attestation requests
        description: Cryptographic attestation requests with Faithful Verification audit trail
        name: attestation_requests
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: US/EU
        domains:
          - https://api.trustauthority.intel.com
          - https://api.eu.trustauthority.intel.com
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Intel Trust Authority API
      - name: Intel SGX / TDX support
      - name: TPM / vTPM support
      - name: NVIDIA GPU attestation
      - name: Faithful Verification audit
      - name: Self-serve developer documentation
  - id: intel-trust-authority-supported
    name: Intel Trust Authority — Paid Support
    type: enterprise
    description: Same attestation service, with paid Intel-issued support, SLA, and account contact.
    entries:
      - label: Support subscription
        description: Annual support subscription
        name: support
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US/EU
        domains:
          - https://api.trustauthority.intel.com
          - https://api.eu.trustauthority.intel.com
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Intel Trust Authority API
      - name: Paid support and SLA
      - name: Named technical contact
  - id: intel-oneapi
    name: Intel oneAPI Toolkits
    type: freemium
    description: Open cross-architecture programming model and toolkits for CPU / GPU / FPGA / AI accelerator
      development. Toolkits and developer access are free; Intel Priority Support is an optional paid
      add-on for enterprise teams.
    entries:
      - label: Toolkit access
        description: Free download / developer use of oneAPI toolkits
        name: toolkit_access
        type: metered
        metric: download
        limit: -1
        timeFrame: usage
        geo: global
        domains:
          - https://api-portal.intel.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Intel Priority Support
        description: Optional annual support subscription for oneAPI toolkits
        name: priority_support
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        domains:
          - https://api-portal.intel.com
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Intel oneAPI compilers and libraries
      - name: VTune / Advisor / Inspector
      - name: Cross-architecture programming
      - name: Free developer use
      - name: Optional Priority Support
