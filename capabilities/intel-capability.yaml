naftiko: 1.0.0-alpha2
info:
  label: Intel oneAPI
  description: Intel oneAPI provides a unified programming model for heterogeneous computing across CPUs, GPUs, AI accelerators,
    and FPGAs.
  tags:
  - Intel
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: intel
    baseUri: https://api-portal.intel.com
    description: Intel oneAPI HTTP API.
    resources:
    - name: tools
      path: /tools
      operations:
      - name: gettools
        method: GET
        description: Get Developer Tools
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: toolkits
      path: /toolkits
      operations:
      - name: gettoolkits
        method: GET
        description: Get Toolkits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: intel-rest
    description: REST adapter for Intel oneAPI.
    resources:
    - path: /tools
      name: gettools
      operations:
      - method: GET
        name: gettools
        description: Get Developer Tools
        call: intel.gettools
        outputParameters:
        - type: object
          mapping: $.
    - path: /toolkits
      name: gettoolkits
      operations:
      - method: GET
        name: gettoolkits
        description: Get Toolkits
        call: intel.gettoolkits
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: intel-mcp
    transport: http
    description: MCP adapter for Intel oneAPI for AI agent use.
    tools:
    - name: gettools
      description: Get Developer Tools
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: intel.gettools
      outputParameters:
      - type: object
        mapping: $.
    - name: gettoolkits
      description: Get Toolkits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: intel.gettoolkits
      outputParameters:
      - type: object
        mapping: $.
