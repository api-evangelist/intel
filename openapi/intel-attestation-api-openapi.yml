openapi: 3.2.0
info:
  title: Intel Trust Authority Attestation API
  description: Intel Trust Authority REST API provides attestation services for secure application development and confidential computing verification.
  version: 1.0.0
  contact:
    name: Intel
    url: https://docs.trustauthority.intel.com/
servers:
- url: https://api.trustauthority.intel.com
  description: Production
tags:
- name: Attestation
  description: Attestation verification operations
paths:
  /attest:
    post:
      operationId: createAttestation
      summary: Create Attestation
      description: Submit an attestation request for verification.
      tags:
      - Attestation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationRequest'
      responses:
        '200':
          description: Attestation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationResponse'
components:
  schemas:
    AttestationRequest:
      type: object
      properties:
        quote:
          type: string
        userData:
          type: string
        policyId:
          type: string
    AttestationResponse:
      type: object
      properties:
        token:
          type: string
        status:
          type: string
        issuedAt:
          type: string
          format: date-time
