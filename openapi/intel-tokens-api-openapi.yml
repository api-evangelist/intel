openapi: 3.2.0
info:
  title: Intel Trust Authority Tokens API
  description: Intel Trust Authority REST API provides attestation services for secure application development and confidential computing verification.
  version: 1.0.0
  contact:
    name: Intel
    url: https://docs.trustauthority.intel.com/
servers:
- url: https://api.trustauthority.intel.com
  description: Production
tags:
- name: Tokens
  description: Token management operations
paths:
  /tokens/{tokenId}:
    get:
      operationId: getAttestationToken
      summary: Get Attestation Token
      description: Retrieve and audit an attestation token.
      tags:
      - Tokens
      parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationToken'
components:
  schemas:
    AttestationToken:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
