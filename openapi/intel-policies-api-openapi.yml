openapi: 3.2.0
info:
  title: Intel Trust Authority Policies API
  description: Intel Trust Authority REST API provides attestation services for secure application development and confidential computing verification.
  version: 1.0.0
  contact:
    name: Intel
    url: https://docs.trustauthority.intel.com/
servers:
- url: https://api.trustauthority.intel.com
  description: Production
tags:
- name: Policies
  description: Policy management operations
paths:
  /policies:
    get:
      operationId: getPolicies
      summary: Get Policies
      description: Retrieve attestation policies.
      tags:
      - Policies
      responses:
        '200':
          description: Policy list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
components:
  schemas:
    Policy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        rules:
          type: array
          items:
            type: string
    PolicyList:
      type: object
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
