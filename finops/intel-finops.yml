specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Intel
providerId: intel
publisherName: Intel Corporation
serviceCategory: Confidential Computing + Developer Tools
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Confidential Computing
  - Attestation
  - oneAPI
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps shape for Intel developer APIs. Both Intel Trust Authority and Intel
  oneAPI are free at the API / toolkit level; the only invoiced lines are optional support subscriptions
  (Intel Trust Authority paid support, Intel Priority Support for oneAPI). FinOps practice for Intel
  APIs therefore focuses on operational telemetry (attestation request volume, rate-limit headroom)
  and on support-renewal accountability rather than per-call cost accounting.
notes: No usage-based invoice for the API itself. The 'cost' to track is operational - request volume,
  region selection, and support entitlement utilization. Reconcile against the customer's Intel Priority
  Support and Trust Authority support contracts.
sources:
  - https://docs.trustauthority.intel.com/main/articles/restapi-intro.html
  - https://www.intel.com/content/www/us/en/developer/tools/oneapi/overview.html
principles:
  - name: Visibility
    description: Track Intel Trust Authority attestation request volume per workload and per region;
      surface oneAPI Priority Support ticket usage in Intel's support portal.
  - name: Allocation
    description: Tag attestation requests by workload / cluster / cost-center so request volume can be
      attributed; map oneAPI Priority Support entitlement to product teams.
  - name: Optimization
    description: Cache attestation tokens for their full validity; co-locate workloads with the closest
      Trust Authority region (US or EU) to reduce latency; align oneAPI support tier to active toolkit
      usage at renewal.
  - name: Accountability
    description: Designate a confidential-computing owner for Trust Authority and a developer-experience
      owner for oneAPI; review attestation-volume growth and support-ticket spend annually.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Forecasting
      - Budgeting
      - Benchmarking
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Free + Optional Support
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Intel Developer APIs
  ServiceCategory: Confidential Computing + Developer Tools
  ProviderName: Intel
  PublisherName: Intel Corporation
  InvoiceIssuerName: Intel Corporation
  PricingCategory: Free
  PricingUnit: not-applicable
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: attestation_requests
    description: Trust Authority attestation requests issued by the customer
    unit: request
    aggregation: sum
    dimensions:
      - region
      - tee_type
      - workload
  - name: support_subscriptions
    description: Active paid support subscriptions (Trust Authority and oneAPI Priority Support)
    unit: subscription-month
    aggregation: max
    dimensions:
      - product
      - tier
apis:
  - name: Intel Trust Authority API
    baseURL: https://api.trustauthority.intel.com
    serviceCategory: API
  - name: Intel oneAPI
    baseURL: https://api-portal.intel.com
    serviceCategory: API
unitEconomics:
  - name: Cost per Active Workload
    metric: support_cost / active_workloads
    target: TBD
  - name: Attestation Requests per Workload
    metric: attestation_requests / active_workloads
    target: TBD
maintainers:
