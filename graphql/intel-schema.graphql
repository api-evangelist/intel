"""
Intel GraphQL Schema
Covers Intel processor architectures, developer tools, AI/ML accelerators, oneAPI,
OpenVINO, cloud services, memory, storage, networking, and platform specifications.
"""

# ─── Scalar types ────────────────────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar URL

# ─── Root operations ─────────────────────────────────────────────────────────

type Query {
  processor(id: ID!): Processor
  processors(filter: ProcessorFilter, limit: Int, offset: Int): [Processor!]!
  processorFamily(id: ID!): ProcessorFamily
  processorFamilies: [ProcessorFamily!]!
  coreArchitecture(id: ID!): CoreArchitecture
  coreArchitectures: [CoreArchitecture!]!
  cpuGeneration(id: ID!): CPUGeneration
  cpuGenerations: [CPUGeneration!]!
  fpgaSpec(id: ID!): FPGASpec
  fpgaSpecs(filter: FPGAFilter): [FPGASpec!]!
  gpuSpec(id: ID!): GPUSpec
  gpuSpecs: [GPUSpec!]!
  gaudiAccelerator(id: ID!): Gaudi
  gaudiAccelerators: [Gaudi!]!
  aiModel(id: ID!): Model
  aiModels(filter: ModelFilter): [Model!]!
  oneAPIToolkit(id: ID!): Toolkit
  oneAPIToolkits: [Toolkit!]!
  openVINORuntime: OpenVINO
  devCloudInstance(id: ID!): CloudInstance
  devCloudInstances(filter: CloudInstanceFilter): [CloudInstance!]!
  sdk(id: ID!): SDK
  sdks: [SDK!]!
  platform(id: ID!): Platform
  platforms: [Platform!]!
  memorySpec(id: ID!): Memory
  memorySpecs: [Memory!]!
  storageSpec(id: ID!): StorageSpec
  storageSpecs: [StorageSpec!]!
  networkAdapter(id: ID!): Ethernet
  networkAdapters: [Ethernet!]!
  developer(id: ID!): Developer
  project(id: ID!): Project
  benchmarkResult(id: ID!): BenchmarkResult
  inferenceResult(id: ID!): InferenceResult
}

type Mutation {
  createProject(input: CreateProjectInput!): Project!
  updateProject(id: ID!, input: UpdateProjectInput!): Project!
  deleteProject(id: ID!): Boolean!
  generateAccessToken(projectId: ID!): AccessToken!
  revokeAccessToken(tokenId: ID!): Boolean!
  submitInferenceJob(input: InferenceJobInput!): InferenceResult!
  optimizeModel(input: ModelOptimizationInput!): ModelOptimization!
  quantizeModel(input: QuantizationInput!): Quantization!
  provisionCloudInstance(input: CloudInstanceInput!): CloudInstance!
  terminateCloudInstance(instanceId: ID!): Boolean!
}

type Subscription {
  inferenceJobStatus(jobId: ID!): InferenceResult!
  cloudInstanceStatus(instanceId: ID!): CloudInstance!
  benchmarkProgress(runId: ID!): BenchmarkResult!
}

# ─── Processor domain ────────────────────────────────────────────────────────

type Processor {
  id: ID!
  name: String!
  modelNumber: String!
  family: ProcessorFamily!
  generation: CPUGeneration!
  architecture: CoreArchitecture!
  spec: CPUSpec!
  instructionSets: [InstructionSet!]!
  sseVersions: [SSEVersion!]!
  avxVersions: [AVXVersion!]!
  integratedGraphics: GPUSpec
  tdp: TDP!
  cache: Cache!
  releaseDate: DateTime
  endOfLife: DateTime
  segment: ProcessorSegment!
  platforms: [Platform!]!
  url: URL
}

type ProcessorFamily {
  id: ID!
  name: String!
  description: String
  segment: ProcessorSegment!
  processors: [Processor!]!
  generations: [CPUGeneration!]!
}

type CoreArchitecture {
  id: ID!
  codename: String!
  processNode: String!
  coreTypes: [String!]!
  description: String
  performanceCores: Int
  efficiencyCores: Int
  maxCores: Int
  supportedMemory: [Memory!]!
  releaseYear: Int
}

type CPUSpec {
  cores: Cores!
  threads: Threads!
  baseClockSpeed: ClockSpeed!
  boostClockSpeed: ClockSpeed
  l1Cache: Cache!
  l2Cache: Cache!
  l3Cache: Cache!
  tdp: TDP!
  maxMemory: Int
  memoryChannels: Int
  memoryTypes: [Memory!]!
  pcieLanes: Int
  pcieVersion: String
  socket: String
}

type CPUGeneration {
  id: ID!
  name: String!
  number: Int!
  codename: String
  architecture: CoreArchitecture
  releaseYear: Int
  processors: [Processor!]!
}

type Cores {
  total: Int!
  performance: Int
  efficiency: Int
}

type Threads {
  total: Int!
  perCore: Int
}

type ClockSpeed {
  value: Float!
  unit: FrequencyUnit!
}

type TDP {
  value: Float!
  unit: PowerUnit!
  configurable: Boolean
  minTDP: Float
  maxTDP: Float
}

type Cache {
  size: Int!
  unit: StorageUnit!
  level: Int
  type: String
}

# ─── Instruction sets ────────────────────────────────────────────────────────

type InstructionSet {
  id: ID!
  name: String!
  version: String
  description: String
  category: InstructionSetCategory!
}

type SSEVersion {
  id: ID!
  version: String!
  registersWidth: Int
  description: String
}

type AVXVersion {
  id: ID!
  version: String!
  registersWidth: Int
  description: String
  vnniSupport: Boolean
}

# ─── FPGA ────────────────────────────────────────────────────────────────────

type FPGASpec {
  id: ID!
  name: String!
  family: String!
  logicElements: Int
  embeddedMemory: Int
  dspBlocks: Int
  transceivers: Int
  pcieLanes: Int
  powerConsumption: TDP
  toolchain: String
  useCase: [String!]!
  url: URL
}

# ─── GPU ─────────────────────────────────────────────────────────────────────

type GPUSpec {
  id: ID!
  name: String!
  architecture: String
  executionUnits: Int
  rayTracingUnits: Int
  tensorCores: Int
  vram: Int
  vramType: String
  maxClockSpeed: ClockSpeed
  tdp: TDP
  apiSupport: [String!]!
  oneAPISupport: Boolean
  url: URL
}

# ─── AI / Gaudi ──────────────────────────────────────────────────────────────

type AI {
  id: ID!
  name: String!
  description: String
  models: [Model!]!
  frameworks: [String!]!
  accelerators: [Gaudi!]!
  openVINO: OpenVINO
  inferenceEngine: String
  supportedPrecisions: [String!]!
}

type Gaudi {
  id: ID!
  name: String!
  generation: Int!
  hbmCapacity: HBM!
  matrixMultiplierEngines: Int
  tensorProcessorCores: Int
  networkBandwidth: Float
  tdp: TDP
  scaleOut: Boolean
  supportedFrameworks: [String!]!
  cloudAvailable: Boolean
  url: URL
}

