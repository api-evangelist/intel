# ─── OpenVINO ────────────────────────────────────────────────────────────────

type OpenVINO {
  id: ID!
  version: String!
  supportedFrameworks: [String!]!
  supportedDevices: [String!]!
  modelOptimizer: Boolean
  runtimeAPI: String
  benchmarkApp: Boolean
  url: URL
