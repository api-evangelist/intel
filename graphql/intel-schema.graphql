# ─── Models ──────────────────────────────────────────────────────────────────

type Model {
  id: ID!
  name: String!
  task: String!
  framework: String!
  precision: String
  size: Float
  sizeUnit: StorageUnit
  inputShape: JSON
  outputShape: JSON
  optimizations: [ModelOptimization!]!
  url: URL
}

type ModelOptimization {
  id: ID!
  model: Model!
  technique: String!
  tool: String!
  baselineAccuracy: Float
  optimizedAccuracy: Float
  speedup: Float
  appliedQuantization: Quantization
  status: OptimizationStatus!
  createdAt: DateTime!
}

type Quantization {
  id: ID!
  model: Model!
  precision: QuantizationPrecision!
  calibrationDataset: String
  accuracyDrop: Float
  throughputGain: Float
  latencyReduction: Float
  status: OptimizationStatus!
}

type Inference {
  id: ID!
  model: Model!
  device: String!
  batchSize: Int!
  precision: String!
  throughput: Throughput!
  latency: Latency!
  createdAt: DateTime!
}

type Throughput {
  value: Float!
  unit: String!
  percentile: Float
}

type Latency {
  mean: Float!
  p50: Float
  p99: Float
  unit: String!
}

type InferenceResult {
  id: ID!
  jobId: String!
  model: Model!
  inference: Inference!
  status: JobStatus!
  createdAt: DateTime!
  completedAt: DateTime
  errorMessage: String
}

# ─── Dev Cloud & Cloud ───────────────────────────────────────────────────────

type DevCloud {
  id: ID!
  name: String!
  description: String
  instances: [CloudInstance!]!
  availableToolkits: [Toolkit!]!
  availableGaudi: [Gaudi!]!
  url: URL
}

type CloudInstance {
  id: ID!
  name: String!
  instanceType: String!
  vcpus: Int!
  memoryGiB: Float!
  storageGiB: Float
  processor: Processor
  gpu: GPUSpec
  gaudi: Gaudi
  region: String!
  status: InstanceStatus!
  createdAt: DateTime!
  terminatedAt: DateTime
  costPerHour: Float
}

# ─── Container ───────────────────────────────────────────────────────────────

type Container {
  id: ID!
  name: String!
  registry: String!
  tag: String!
  baseOS: String
  toolkits: [Toolkit!]!
  size: Float
  sizeUnit: StorageUnit
  url: URL
}

# ─── SDK / Toolkit / Library / Platform ──────────────────────────────────────

type SDK {
  id: ID!
  name: String!
  version: String!
  description: String
  languages: [String!]!
  platforms: [Platform!]!
  downloadUrl: URL
  documentationUrl: URL
  licenseType: String
}

type Toolkit {
  id: ID!
  name: String!
  version: String!
  description: String
  components: [Library!]!
  targetUseCase: String
  supportedOS: [String!]!
  url: URL
}

type Library {
  id: ID!
  name: String!
  version: String!
  description: String
  category: LibraryCategory!
  languages: [String!]!
  toolkit: Toolkit
  url: URL
}

type Platform {
  id: ID!
  name: String!
  segment: PlatformSegment!
  description: String
  processors: [Processor!]!
  memory: [Memory!]!
  storage: [StorageSpec!]!
  networking: [Ethernet!]!
  formFactor: String
  url: URL
}

# ─── Memory ──────────────────────────────────────────────────────────────────

type Memory {
  id: ID!
  type: MemoryType!
  speed: ClockSpeed!
  capacity: Int
  channels: Int
  ecc: Boolean
  description: String
}

type DDR5 {
  id: ID!
  speed: ClockSpeed!
  capacity: Int
  channels: Int
  ecc: Boolean
  rdimm: Boolean
  lrdimm: Boolean
}

type HBM {
  id: ID!
  generation: String!
  capacityGB: Int!
  bandwidthGBps: Float!
  stackCount: Int
}

# ─── Storage ─────────────────────────────────────────────────────────────────

type StorageSpec {
  id: ID!
  name: String!
  type: StorageType!
  capacity: Float!
  unit: StorageUnit!
  readSpeedMBps: Float
  writeSpeedMBps: Float
  iops: Int
  interface: String
  formFactor: String
  url: URL
}

type NAND {
  id: ID!
  cellType: NANDCellType!
  layers: Int
  density: Float
  densityUnit: StorageUnit
  readLatencyNs: Float
  writeLatencyNs: Float
}

type Optane {
  id: ID!
  capacity: Float!
  unit: StorageUnit!
  readLatencyNs: Float
  writeLatencyNs: Float
  endurance: String
  formFactor: String
  pmemMode: Boolean
  url: URL
}

