# ─── Developer / Auth ────────────────────────────────────────────────────────

type Developer {
  id: ID!
  name: String!
  email: String!
  organization: String
  projects: [Project!]!
  accessTokens: [AccessToken!]!
  createdAt: DateTime!
}

type AccessToken {
  id: ID!
  name: String!
  token: String
  scopes: [String!]!
  expiresAt: DateTime
  createdAt: DateTime!
  lastUsed: DateTime
}

type ProjectKey {
  id: ID!
  project: Project!
  keyId: String!
  secret: String
  createdAt: DateTime!
  expiresAt: DateTime
}

type Project {
  id: ID!
  name: String!
  description: String
  developer: Developer!
  keys: [ProjectKey!]!
  instances: [CloudInstance!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type BenchmarkResult {
  id: ID!
  runId: String!
  processor: Processor
  gaudi: Gaudi
  workload: String!
  score: Float!
  unit: String!
  configuration: JSON
  createdAt: DateTime!
}

# ─── Input types ─────────────────────────────────────────────────────────────

input ProcessorFilter {
  familyId: ID
  generationId: ID
  segment: ProcessorSegment
  minCores: Int
  maxTDP: Float
}

input FPGAFilter {
  family: String
  minLogicElements: Int
}

input ModelFilter {
  task: String
  framework: String
  precision: String
}

input CloudInstanceFilter {
  region: String
  hasGaudi: Boolean
  minVcpus: Int
  status: InstanceStatus
}

input CreateProjectInput {
  name: String!
  description: String
}

input UpdateProjectInput {
  name: String
  description: String
}

input InferenceJobInput {
  modelId: ID!
  device: String!
  batchSize: Int!
  precision: String
  instanceId: ID
}

input ModelOptimizationInput {
  modelId: ID!
  technique: String!
  tool: String!
}

input QuantizationInput {
  modelId: ID!
  precision: QuantizationPrecision!
  calibrationDataset: String
}

input CloudInstanceInput {
  instanceType: String!
  region: String!
  projectId: ID!
}

# ─── Enums ───────────────────────────────────────────────────────────────────

enum ProcessorSegment {
  DESKTOP
  LAPTOP
  SERVER
  WORKSTATION
  EMBEDDED
  IOT
  MOBILE
}

enum PlatformSegment {
  SERVER
  WORKSTATION
  DESKTOP
  MOBILE
  EMBEDDED
  EDGE
  IOT
}

enum InstructionSetCategory {
  GENERAL
  SIMD
  VECTOR
  AI
  CRYPTO
  MEMORY
}

enum MemoryType {
  DDR4
  DDR5
  LPDDR5
  HBM2
  HBM2E
  HBM3
  OPTANE
}

enum StorageType {
  NAND_SSD
  OPTANE_SSD
  NVMe
  SATA
  HDD
}

enum StorageUnit {
  B
  KB
  MB
  GB
  TB
  PB
}

enum FrequencyUnit {
  MHz
  GHz
}

enum PowerUnit {
  mW
  W
}

enum NANDCellType {
  SLC
  MLC
  TLC
  QLC
}

enum CXLType {
  TYPE1
  TYPE2
  TYPE3
}

enum QuantizationPrecision {
  FP32
  FP16
  BF16
  INT8
  INT4
}

enum OptimizationStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
}

enum JobStatus {
  QUEUED
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
}

enum InstanceStatus {
  PROVISIONING
  RUNNING
  STOPPED
  TERMINATED
  ERROR
}

enum LibraryCategory {
  MATH
  DEEP_LEARNING
  SIGNAL_PROCESSING
  COMPUTER_VISION
  DATA_ANALYTICS
  PARALLEL_COMPUTING
  CRYPTOGRAPHY
}
